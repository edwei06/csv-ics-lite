[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-ics-lite"
version = "0.1.0"
description = "Convert strict event CSV to portable iCalendar files offline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "edwei06"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
csv-ics-lite = "csv_ics_lite.cli:main"

[tool.setuptools.packages.find]
include = ["csv_ics_lite*"]
